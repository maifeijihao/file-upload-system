<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>压缩包上传与下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 1000px;
            margin: 40px 20px;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .main-content {
            padding: 40px;
        }
        
        /* 密码验证弹窗 */
        .password-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .password-box {
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            overflow: hidden;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .password-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .password-header h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        
        .password-body {
            padding: 30px;
        }
        
        .password-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        
        .password-input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .password-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        
        .password-btn:hover {
            transform: translateY(-2px);
        }
        
        .password-error {
            color: #ff4757;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        
        /* 上传区域 */
        .upload-section {
            margin-bottom: 40px;
        }
        
        .upload-box {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
            position: relative;
        }
        
        .upload-box:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }
        
        .upload-box.dragover {
            border-color: #667eea;
            background: #e8ebff;
        }
        
        .upload-icon {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .upload-box h3 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 10px;
        }
        
        .upload-box p {
            color: #666;
            margin-bottom: 20px;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .file-input {
            display: none;
        }
        
        /* 文件列表区域 */
        .files-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .stats {
            display: flex;
            gap: 30px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }
        
        .file-count { color: #667eea; }
        .total-size { color: #764ba2; }
        .success-count { color: #00b894; }
        .failed-count { color: #ff4757; }
        
        .batch-btn {
            background: #00b894;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .batch-btn:hover:not(:disabled) {
            background: #00a085;
            transform: translateY(-2px);
        }
        
        .batch-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        /* 文件列表 */
        .file-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        
        .file-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .file-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        
        .file-details {
            flex: 1;
        }
        
        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .file-size {
            color: #666;
            font-size: 0.9rem;
        }
        
        .file-actions {
            display: flex;
            gap: 10px;
        }
        
        .copy-btn {
            background: #0984e3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .copy-btn:hover {
            background: #0770c4;
        }
        
        .empty-message {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        /* 进度条 */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        /* 认证状态 */
        .auth-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.3);
            z-index: 100;
            animation: slideInRight 0.3s ease;
            display: none;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                margin: 20px 10px;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .stats-bar {
                flex-direction: column;
                gap: 20px;
            }
            
            .stats {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .file-item {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }
            
            .file-actions {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <!-- 密码验证弹窗 -->
    <div id="passwordModal" class="password-modal">
        <div class="password-box">
            <div class="password-header">
                <h2>🔒 安全验证</h2>
                <p>请输入密码访问文件系统</p>
            </div>
            <div class="password-body">
                <input type="password" id="passwordInput" class="password-input" placeholder="请输入访问密码" autocomplete="current-password">
                <button id="passwordSubmit" class="password-btn">验证并进入</button>
                <div id="passwordError" class="password-error">密码错误，请重试</div>
            </div>
        </div>
    </div>

    <!-- 认证状态提示 -->
    <div id="authStatus" class="auth-status">
        <span>已认证用户</span>
        <button id="logoutBtn" class="logout-btn">退出</button>
    </div>

    <div class="container">
        <div class="header">
            <h1>📁 文件上传与管理系统</h1>
            <p>安全、快速的文件上传与分享平台</p>
        </div>

        <div class="main-content">
            <!-- 上传区域 -->
            <div class="upload-section">
                <div id="uploadBox" class="upload-box">
                    <div class="upload-icon">📤</div>
                    <h3>拖放文件到此处上传</h3>
                    <p>支持 ZIP, RAR, 7Z, TAR, GZ 格式，最大 1GB</p>
                    <button id="selectFileBtn" class="upload-btn">
                        <span>📁</span> 选择文件
                    </button>
                    <input type="file" id="fileInput" class="file-input" multiple accept=".zip,.rar,.7z,.tar,.gz,.tar.gz">
                </div>
            </div>

            <!-- 文件列表区域 -->
            <div class="files-section">
                <div class="stats-bar">
                    <div class="stats">
                        <div class="stat-item">
                            <span id="totalFiles" class="stat-value file-count">0</span>
                            <span class="stat-label">文件数量</span>
                        </div>
                        <div class="stat-item">
                            <span id="totalSize" class="stat-value total-size">0</span>
                            <span class="stat-label">总大小</span>
                        </div>
                        <div class="stat-item">
                            <span id="successCount" class="stat-value success-count">0</span>
                            <span class="stat-label">成功</span>
                        </div>
                        <div class="stat-item">
                            <span id="failedCount" class="stat-value failed-count">0</span>
                            <span class="stat-label">失败</span>
                        </div>
                    </div>
                    <button id="batchCopyBtn" class="batch-btn" disabled>📋 批量复制链接</button>
                </div>

                <div id="fileList" class="file-list">
                    <div class="empty-message">
                        <div style="font-size: 48px; margin-bottom: 20px;">📂</div>
                        <h3>暂无文件</h3>
                        <p>上传文件后，它们会显示在这里</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== DOM 元素 ====================
        const passwordModal = document.getElementById('passwordModal');
        const passwordInput = document.getElementById('passwordInput');
        const passwordSubmit = document.getElementById('passwordSubmit');
        const passwordError = document.getElementById('passwordError');
        const authStatus = document.getElementById('authStatus');
        const logoutBtn = document.getElementById('logoutBtn');
        const uploadBox = document.getElementById('uploadBox');
        const selectFileBtn = document.getElementById('selectFileBtn');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const batchCopyBtn = document.getElementById('batchCopyBtn');
        
        // 统计元素
        const totalFilesEl = document.getElementById('totalFiles');
        const totalSizeEl = document.getElementById('totalSize');
        const successCountEl = document.getElementById('successCount');
        const failedCountEl = document.getElementById('failedCount');
        
        // 状态变量
        let isAuthenticated = false;
        let uploadQueue = [];
        let activeUploads = new Map();
        let failedUploads = [];
        let currentFiles = [];
        
        // ==================== 工具函数 ====================
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function getFileExtension(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (filename.toLowerCase().endsWith('.tar.gz')) return '.tar.gz';
            return '.' + ext;
        }
        
        // ==================== 认证相关 ====================
        async function checkAuth() {
            try {
                const response = await fetch('/check_auth');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                return data.authenticated || false;
            } catch (error) {
                console.error('检查认证失败:', error);
                return false;
            }
        }
        
        async function login(password) {
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                return await response.json();
            } catch (error) {
                console.error('登录失败:', error);
                return { success: false, message: '网络错误' };
            }
        }
        
        async function logout() {
            try {
                await fetch('/logout', { method: 'POST' });
                return true;
            } catch (error) {
                console.error('登出失败:', error);
                return false;
            }
        }
        
        async function updateAuthStatus() {
            isAuthenticated = await checkAuth();
            
            if (isAuthenticated) {
                passwordModal.style.display = 'none';
                authStatus.style.display = 'block';
                uploadBox.style.pointerEvents = 'auto';
                uploadBox.style.opacity = '1';
                selectFileBtn.disabled = false;
                await loadFiles();
            } else {
                passwordModal.style.display = 'flex';
                authStatus.style.display = 'none';
                uploadBox.style.pointerEvents = 'none';
                uploadBox.style.opacity = '0.5';
                selectFileBtn.disabled = true;
                showEmptyState('请先通过密码验证');
                updateStats(0, 0, 0, 0);
            }
        }
        
        // ==================== 文件管理 ====================
        async function loadFiles() {
            try {
                const response = await fetch('/files');
                if (response.status === 401) {
                    await updateAuthStatus();
                    return;
                }
                
                if (!response.ok) throw new Error('获取文件列表失败');
                
                const data = await response.json();
                if (!data.success) throw new Error(data.message);
                
                currentFiles = data.files || [];
                displayFiles(currentFiles);
                
            } catch (error) {
                console.error('加载文件失败:', error);
                showEmptyState('加载文件列表失败');
            }
        }
        
        function displayFiles(files) {
            if (!files || files.length === 0) {
                showEmptyState('暂无文件');
                updateStats(0, 0, 0, failedUploads.length);
                return;
            }
            
            let totalSize = 0;
            let html = '';
            
            files.forEach(file => {
                totalSize += file.size || 0;
                // 使用原始文件名显示，但下载链接使用UUID
                const displayName = file.original_name || file.name || file.filename;
                const fileSize = formatFileSize(file.size || 0);
                const fileId = file.uuid || file.filename; // UUID文件名
                const downloadUrl = `/download/${fileId}`; // 使用UUID构建下载链接
                const fileExt = getFileExtension(displayName).toLowerCase();
                
                // 根据文件类型设置图标
                let fileIcon = '📄';
                if (fileExt === '.zip') fileIcon = '🗜️';
                else if (fileExt === '.rar') fileIcon = '🗃️';
                else if (fileExt === '.7z') fileIcon = '🗄️';
                else if (fileExt === '.tar' || fileExt === '.tar.gz') fileIcon = '📦';
                else if (fileExt === '.gz') fileIcon = '💨';
                
                html += `
                    <div class="file-item" data-id="${fileId}">
                        <div class="file-info">
                            <div class="file-icon">${fileIcon}</div>
                            <div class="file-details">
                                <div class="file-name" title="${displayName}">${displayName}</div>
                                <div class="file-size">${fileSize}</div>
                                <div style="font-size: 11px; color: #999; margin-top: 3px;">
                                    文件ID: ${fileId.substring(0, 8)}...
                                </div>
                            </div>
                        </div>
                        <div class="file-actions">
                            <button class="copy-btn" onclick="copyLink('${fileId}', '${displayName}')">复制链接</button>
                        </div>
                    </div>
                `;
            });
            
            fileList.innerHTML = html;
            updateStats(files.length, totalSize, files.length, failedUploads.length);
        }
        
        function showEmptyState(message = '暂无文件') {
            fileList.innerHTML = `
                <div class="empty-message">
                    <div style="font-size: 48px; margin-bottom: 20px;">📂</div>
                    <h3>${message}</h3>
                    <p>${message.includes('验证') ? '请先输入密码验证身份' : '上传文件后，它们会显示在这里'}</p>
                </div>
            `;
        }
        
        function updateStats(total, size, success, failed) {
            totalFilesEl.textContent = total;
            totalSizeEl.textContent = formatFileSize(size);
            successCountEl.textContent = success;
            failedCountEl.textContent = failed;
            batchCopyBtn.disabled = total === 0;
        }
        
        // ==================== 文件上传 ====================
        async function uploadFile(file) {
            // 验证文件类型
            const allowedExts = ['.zip', '.rar', '.7z', '.tar', '.gz', '.tar.gz'];
            const fileExt = getFileExtension(file.name);
            
            if (!allowedExts.includes(fileExt)) {
                alert(`不支持的文件格式: ${fileExt}\n请上传压缩文件 (ZIP, RAR, 7Z, TAR, GZ)`);
                failedUploads.push({ name: file.name, error: '不支持的文件格式' });
                updateStats(currentFiles.length, 
                           currentFiles.reduce((s, f) => s + (f.size || 0), 0),
                           currentFiles.length,
                           failedUploads.length);
                return;
            }
            
            // 验证文件大小 (1GB)
            if (file.size > 1024 * 1024 * 1024) {
                alert(`文件太大: ${formatFileSize(file.size)}\n最大支持 1GB`);
                failedUploads.push({ name: file.name, error: '文件超过大小限制' });
                updateStats(currentFiles.length,
                           currentFiles.reduce((s, f) => s + (f.size || 0), 0),
                           currentFiles.length,
                           failedUploads.length);
                return;
            }
            
            // 创建上传项目
            const uploadId = 'upload_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const uploadItem = createUploadItem(file, uploadId);
            
            // 准备表单数据
            const formData = new FormData();
            formData.append('file', file);
            
            // 创建 XMLHttpRequest
            const xhr = new XMLHttpRequest();
            
            // 进度事件
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    updateUploadProgress(uploadId, percent);
                }
            });
            
            // 完成事件
            xhr.addEventListener('load', () => {
                handleUploadComplete(uploadId, xhr, file);
            });
            
            // 错误事件
            xhr.addEventListener('error', () => {
                handleUploadError(uploadId, file, '网络错误');
            });
            
            // 存储上传
            activeUploads.set(uploadId, { xhr, file, item: uploadItem });
            
            // 发送请求
            xhr.open('POST', '/upload');
            xhr.send(formData);
        }
        
        function createUploadItem(file, uploadId) {
            // 移除空状态
            if (fileList.querySelector('.empty-message')) {
                fileList.innerHTML = '';
            }
            
            const item = document.createElement('div');
            item.className = 'file-item';
            item.id = uploadId;
            item.innerHTML = `
                <div class="file-info">
                    <div class="file-icon">⏳</div>
                    <div class="file-details">
                        <div class="file-name" title="${file.name}">${file.name}</div>
                        <div class="file-size">${formatFileSize(file.size)}</div>
                        <div class="progress-container">
                            <div class="progress-bar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="file-actions">
                    <button class="copy-btn" style="background: #ff4757;" onclick="cancelUpload('${uploadId}')">
                        取消
                    </button>
                </div>
            `;
            
            // 显示进度条
            item.querySelector('.progress-container').style.display = 'block';
            
            // 添加到列表顶部
            fileList.prepend(item);
            return item;
        }
        
        function updateUploadProgress(uploadId, percent) {
            const item = document.getElementById(uploadId);
            if (item) {
                const progressBar = item.querySelector('.progress-bar');
                if (progressBar) {
                    progressBar.style.width = percent + '%';
                }
            }
        }
        
        function handleUploadComplete(uploadId, xhr, file) {
            const upload = activeUploads.get(uploadId);
            if (!upload) return;
            
            try {
                const response = JSON.parse(xhr.responseText);
                
                if (xhr.status === 200 && response.success) {
                    // 上传成功
                    upload.item.querySelector('.file-icon').textContent = '✅';
                    upload.item.querySelector('.progress-bar').style.background = '#00b894';
                    
                    // 显示成功信息
                    const uuidFilename = response.uuid_filename || '未知UUID';
                    upload.item.querySelector('.file-name').innerHTML = 
                        `${file.name} <small style="color: #00b894;">(上传成功)</small>`;
                    
                    setTimeout(() => {
                        if (upload.item.parentNode) {
                            upload.item.remove();
                        }
                        loadFiles(); // 重新加载文件列表
                    }, 1000);
                    
                } else if (xhr.status === 401) {
                    // 未授权
                    handleUploadError(uploadId, file, '会话过期，请重新登录');
                    updateAuthStatus();
                } else {
                    // 其他错误
                    const errorMsg = response.message || '上传失败';
                    handleUploadError(uploadId, file, errorMsg);
                }
            } catch (error) {
                handleUploadError(uploadId, file, '服务器响应错误');
            }
            
            activeUploads.delete(uploadId);
        }
        
        function handleUploadError(uploadId, file, error) {
            const upload = activeUploads.get(uploadId);
            if (!upload) return;
            
            upload.item.querySelector('.file-icon').textContent = '❌';
            upload.item.querySelector('.file-name').innerHTML = `${file.name} <small style="color: #ff4757;">(${error})</small>`;
            upload.item.querySelector('.progress-bar').style.background = '#ff4757';
            upload.item.querySelector('.copy-btn').style.display = 'none';
            
            failedUploads.push({ name: file.name, error });
            
            setTimeout(() => {
                if (upload.item.parentNode) {
                    upload.item.remove();
                }
                updateStats(currentFiles.length,
                           currentFiles.reduce((s, f) => s + (f.size || 0), 0),
                           currentFiles.length,
                           failedUploads.length);
            }, 3000);
            
            activeUploads.delete(uploadId);
        }
        
        // ==================== 全局函数 ====================
        window.cancelUpload = function(uploadId) {
            const upload = activeUploads.get(uploadId);
            if (upload && upload.xhr) {
                upload.xhr.abort();
                upload.item.querySelector('.file-icon').textContent = '⏹️';
                upload.item.querySelector('.file-name').innerHTML = `${upload.file.name} <small style="color: #999;">(已取消)</small>`;
                
                setTimeout(() => {
                    if (upload.item.parentNode) {
                        upload.item.remove();
                    }
                }, 1000);
                
                activeUploads.delete(uploadId);
            }
        };
        
        window.copyLink = async function(fileId, displayName) {
            const fileUrl = `${window.location.origin}/download/${fileId}`;
            
            try {
                await navigator.clipboard.writeText(fileUrl);
                alert(`✅ 链接已复制到剪贴板\n\n文件名: ${displayName}\n链接: ${fileUrl}`);
            } catch (err) {
                // 备用方法
                const textarea = document.createElement('textarea');
                textarea.value = fileUrl;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    alert(`✅ 链接已复制到剪贴板\n\n文件名: ${displayName}\n链接: ${fileUrl}`);
                } catch (err2) {
                    alert('❌ 复制失败，请手动复制链接:\n' + fileUrl);
                }
                document.body.removeChild(textarea);
            }
        };
        
        // ==================== 事件监听 ====================
        // 密码验证
        passwordSubmit.addEventListener('click', async () => {
            const password = passwordInput.value.trim();
            if (!password) {
                passwordError.textContent = '请输入密码';
                passwordError.style.display = 'block';
                return;
            }
            
            const result = await login(password);
            
            if (result.success) {
                await updateAuthStatus();
                passwordError.style.display = 'none';
                passwordInput.value = '';
            } else {
                passwordError.textContent = result.message || '密码错误';
                passwordError.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
            }
        });
        
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                passwordSubmit.click();
            }
        });
        
        // 退出登录
        logoutBtn.addEventListener('click', async () => {
            await logout();
            await updateAuthStatus();
        });
        
        // 选择文件
        selectFileBtn.addEventListener('click', () => {
            if (!isAuthenticated) {
                alert('请先通过密码验证');
                return;
            }
            fileInput.click();
        });
        
        fileInput.addEventListener('change', (e) => {
            if (!isAuthenticated) {
                alert('请先通过密码验证');
                return;
            }
            
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            files.forEach(file => {
                uploadFile(file);
            });
            
            fileInput.value = ''; // 清除选择，允许选择相同文件
        });
        
        // 拖放上传
        uploadBox.addEventListener('dragover', (e) => {
            if (!isAuthenticated) {
                e.preventDefault();
                return;
            }
            e.preventDefault();
            uploadBox.classList.add('dragover');
        });
        
        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragover');
        });
        
        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragover');
            
            if (!isAuthenticated) {
                alert('请先通过密码验证');
                return;
            }
            
            const files = Array.from(e.dataTransfer.files);
            if (files.length === 0) return;
            
            files.forEach(file => {
                uploadFile(file);
            });
        });
        
        // 批量复制
        batchCopyBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/files');
                if (!response.ok) throw new Error('获取文件列表失败');
                
                const data = await response.json();
                if (!data.success) throw new Error(data.message);
                
                const files = data.files || [];
                if (files.length === 0) {
                    alert('没有文件可以复制');
                    return;
                }
                
                const serverUrl = window.location.origin;
                let allLinks = '';
                
                files.forEach((file, index) => {
                    const displayName = file.original_name || file.name || file.filename;
                    const fileId = file.uuid || file.filename;
                    const fileUrl = `${serverUrl}/download/${fileId}`;
                    allLinks += `${index + 1}. ${displayName}\n${fileUrl}\n\n`;
                });
                
                try {
                    await navigator.clipboard.writeText(allLinks);
                    alert(`✅ 已复制 ${files.length} 个文件的链接到剪贴板！`);
                } catch (err) {
                    // 备用方法
                    const textarea = document.createElement('textarea');
                    textarea.value = allLinks;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert(`✅ 已复制 ${files.length} 个文件的链接到剪贴板！`);
                }
                
            } catch (error) {
                console.error('批量复制失败:', error);
                alert('批量复制失败: ' + error.message);
            }
        });
        
        // ==================== 初始化 ====================
        async function init() {
            await updateAuthStatus();
            
            // 每30秒刷新文件列表
            setInterval(async () => {
                if (isAuthenticated) {
                    await loadFiles();
                }
            }, 30000);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
