<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }
        
        h1 {
            text-align: center;
            margin: 20px 0 30px;
            color: #333;
        }
        
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            background-color: #fff;
            cursor: pointer;
        }
        
        .upload-area:hover {
            border-color: #4a90e2;
            background-color: #f9f9f9;
        }
        
        .upload-area.dragover {
            border-color: #4a90e2;
            background-color: #f0f7ff;
        }
        
        .upload-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .upload-btn:hover {
            background-color: #3a7bc8;
        }
        
        .upload-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .file-input {
            display: none;
        }
        
        .files-container {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .stats-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 6px;
        }
        
        .stats-left {
            display: flex;
            gap: 25px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        
        .stat-value {
            font-weight: bold;
            font-size: 16px;
            min-width: 25px;
            text-align: center;
        }
        
        .file-count {
            color: #4a90e2;
        }
        
        .total-size {
            color: #9b59b6;
        }
        
        .success-count {
            color: #27ae60;
        }
        
        .failed-count {
            color: #e74c3c;
        }
        
        .stats-right {
            display: flex;
            gap: 10px;
        }
        
        .view-toggle {
            display: flex;
            background-color: #f1f1f1;
            border-radius: 4px;
            overflow: hidden;
            margin-right: 10px;
        }
        
        .view-toggle-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            transition: all 0.3s;
        }
        
        .view-toggle-btn.active {
            background-color: #4a90e2;
            color: white;
        }
        
        .batch-copy-btn {
            background-color: #9b59b6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .batch-copy-btn:hover {
            background-color: #8e44ad;
        }
        
        .batch-copy-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .batch-copy-current {
            background-color: #27ae60;
        }
        
        .batch-copy-current:hover {
            background-color: #219653;
        }
        
        .file-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .file-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-item:last-child {
            border-bottom: none;
        }
        
        .file-info {
            display: flex;
            align-items: center;
            gap: 0;
        }
        
        .file-details {
            flex: 1;
            margin-left: 0;
        }
        
        .file-name {
            font-weight: bold;
            color: #333;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 5px;
        }
        
        .file-size {
            color: #666;
            font-size: 14px;
        }
        
        .file-uuid {
            color: #999;
            font-size: 11px;
            margin-top: 3px;
        }
        
        .file-upload-time {
            color: #4a90e2;
            font-size: 11px;
            margin-top: 3px;
        }
        
        .file-status {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 10px;
        }
        
        .status-uploading {
            background-color: #f39c12;
            color: white;
        }
        
        .status-success {
            background-color: #27ae60;
            color: white;
        }
        
        .status-failed {
            background-color: #e74c3c;
            color: white;
        }
        
        .copy-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .copy-btn:hover {
            background-color: #6c7b7d;
        }
        
        .cancel-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-left: 5px;
        }
        
        .cancel-btn:hover {
            background-color: #c0392b;
        }
        
        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 0;
        }
        
        .password-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .password-modal-content {
            background-color: white;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        
        .password-modal-header {
            background-color: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .password-modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .password-modal-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .password-modal-body {
            padding: 25px;
        }
        
        .password-input-group {
            margin-bottom: 20px;
        }
        
        .password-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .password-input:focus {
            border-color: #4a90e2;
            outline: none;
        }
        
        .password-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        .password-modal-btn {
            padding: 10px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        
        .password-modal-submit {
            background-color: #27ae60;
            color: white;
        }
        
        .password-modal-submit:hover {
            background-color: #219653;
        }
        
        .password-error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .password-error.show {
            display: block;
        }
        
        .auth-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #27ae60;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            display: none;
        }
        
        .auth-status.show {
            display: block;
        }
        
        .auth-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .lock-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #ccc;
            z-index: 1;
        }
        
        .locked {
            position: relative;
        }
        
        .locked::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            z-index: 1;
        }
        
        .progress-container {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4a90e2 0%, #9b59b6 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        @media (max-width: 768px) {
            body { padding: 10px; }
            .stats-row { flex-direction: column; gap: 15px; align-items: stretch; }
            .stats-left { flex-wrap: wrap; justify-content: center; gap: 15px; }
            .stats-right { flex-direction: column; gap: 10px; }
            .view-toggle { margin-right: 0; justify-content: center; }
            .file-info { flex-direction: column; align-items: flex-start; gap: 5px; }
            .file-name { max-width: 200px; }
            .auth-status { position: static; margin-bottom: 15px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="password-modal-overlay" id="passwordModal">
        <div class="password-modal-content">
            <div class="password-modal-header">
                <div class="password-modal-title">密码验证</div>
                <div class="password-modal-subtitle">请输入访问密码以使用上传功能</div>
            </div>
            <div class="password-modal-body">
                <div class="password-input-group">
                    <input type="password" class="password-input" id="passwordInput" placeholder="请输入访问密码" autocomplete="current-password">
                    <div class="password-error" id="passwordError">密码错误，请重试</div>
                </div>
                <div class="password-modal-footer">
                    <button class="password-modal-btn password-modal-submit" id="passwordSubmitBtn">验证</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="auth-status" id="authStatus">
        已通过验证
        <button class="auth-logout" id="logoutBtn">退出</button>
    </div>
    
    <h1>压缩包上传与下载</h1>
    
    <div class="upload-area" id="uploadBox">
        <p>拖放文件到此处或点击按钮选择</p>
        <button class="upload-btn" id="selectFileBtn">选择压缩包文件</button>
        <input type="file" class="file-input" id="fileInput" multiple accept=".zip,.rar,.7z,.tar,.gz,.tar.gz">
        <div class="lock-icon" id="lockIcon">🔒</div>
    </div>
    
    <div class="files-container" id="filesContainer">
        <div class="stats-row">
            <div class="stats-left">
                <div class="stat-item"><span class="stat-label">文件数量:</span><span class="stat-value file-count" id="totalFiles">0</span></div>
                <div class="stat-item"><span class="stat-label">总大小:</span><span class="stat-value total-size" id="totalSize">0</span></div>
                <div class="stat-item"><span class="stat-label">成功:</span><span class="stat-value success-count" id="successCount">0</span></div>
                <div class="stat-item"><span class="stat-label">失败:</span><span class="stat-value failed-count" id="failedCount">0</span></div>
            </div>
            <div class="stats-right">
                <div class="view-toggle">
                    <button class="view-toggle-btn active" id="currentViewBtn">当前上传</button>
                    <button class="view-toggle-btn" id="allViewBtn">查看所有</button>
                </div>
                <button class="batch-copy-btn batch-copy-current" id="batchCopyCurrentBtn" disabled>批量复制当前</button>
                <button class="batch-copy-btn" id="batchCopyAllBtn" disabled>批量复制所有</button>
            </div>
        </div>
        <div class="file-list" id="fileList"><div class="empty-message">暂无上传文件</div></div>
    </div>

    <script>
        // DOM 元素
        const passwordModal = document.getElementById('passwordModal');
        const passwordInput = document.getElementById('passwordInput');
        const passwordSubmitBtn = document.getElementById('passwordSubmitBtn');
        const passwordError = document.getElementById('passwordError');
        const authStatus = document.getElementById('authStatus');
        const logoutBtn = document.getElementById('logoutBtn');
        const uploadBox = document.getElementById('uploadBox');
        const selectFileBtn = document.getElementById('selectFileBtn');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const batchCopyCurrentBtn = document.getElementById('batchCopyCurrentBtn');
        const batchCopyAllBtn = document.getElementById('batchCopyAllBtn');
        const lockIcon = document.getElementById('lockIcon');
        const currentViewBtn = document.getElementById('currentViewBtn');
        const allViewBtn = document.getElementById('allViewBtn');
        const totalFilesEl = document.getElementById('totalFiles');
        const totalSizeEl = document.getElementById('totalSize');
        const successCountEl = document.getElementById('successCount');
        const failedCountEl = document.getElementById('failedCount');
        
        // 状态
        let isAuthenticated = false;
        let activeUploads = new Map();   // 上传中的文件
        let failedUploads = [];           // 失败的文件
        let currentFiles = [];            // 服务器上所有文件
        let currentSessionFiles = [];     // 当前会话成功上传的文件
        let currentViewMode = 'current';  // 'current' 或 'all'
        
        // 工具函数
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function getFileExtension(filename) {
            if (filename.toLowerCase().endsWith('.tar.gz')) return '.tar.gz';
            return '.' + filename.split('.').pop().toLowerCase();
        }
        
        function formatUploadTime(timestamp) {
            if (!timestamp) return '未知时间';
            const date = new Date(timestamp * 1000);
            const Y = date.getFullYear();
            const M = String(date.getMonth() + 1).padStart(2,'0');
            const D = String(date.getDate()).padStart(2,'0');
            const h = String(date.getHours()).padStart(2,'0');
            const m = String(date.getMinutes()).padStart(2,'0');
            const s = String(date.getSeconds()).padStart(2,'0');
            return `${Y}-${M}-${D} ${h}:${m}:${s}`;
        }
        
        // 认证
        async function checkAuth() {
            try {
                const res = await fetch('/check_auth');
                const data = await res.json();
                return data.authenticated || false;
            } catch { return false; }
        }
        
        async function login(pwd) {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            });
            return await res.json();
        }
        
        async function logout() {
            await fetch('/logout', { method: 'POST' });
        }
        
        async function updateAuthStatus() {
            isAuthenticated = await checkAuth();
            if (isAuthenticated) {
                passwordModal.style.display = 'none';
                authStatus.classList.add('show');
                uploadBox.classList.remove('locked');
                lockIcon.style.display = 'none';
                selectFileBtn.disabled = false;
                uploadBox.style.cursor = 'pointer';
                selectFileBtn.style.cursor = 'pointer';
                await loadFiles();      // 获取服务器文件列表
            } else {
                passwordModal.style.display = 'flex';
                authStatus.classList.remove('show');
                uploadBox.classList.add('locked');
                lockIcon.style.display = 'block';
                selectFileBtn.disabled = true;
                uploadBox.style.cursor = 'not-allowed';
                selectFileBtn.style.cursor = 'not-allowed';
                showEmptyState('请先通过密码验证');
                updateStats(0,0,0,0);
            }
        }
        
        // 加载服务器文件列表（失败时保留旧数据）
        async function loadFiles() {
            if (!isAuthenticated) return;
            try {
                const res = await fetch('/files');
                if (res.status === 401) {
                    await updateAuthStatus();
                    return;
                }
                const data = await res.json();
                if (data.success) {
                    currentFiles = data.files || [];
                    // 按上传时间倒序
                    currentFiles.sort((a,b) => (b.upload_time||0) - (a.upload_time||0));
                } else {
                    console.warn('获取文件列表失败:', data.message);
                }
            } catch (err) {
                console.error('加载文件列表网络错误:', err);
            } finally {
                updateDisplay();   // 无论成败都刷新界面（当前会话文件仍会显示）
            }
        }
        
        function updateDisplay() {
            if (currentViewMode === 'current') {
                // 当前会话文件（包括上传中、成功、失败）
                const sortedSuccess = [...currentSessionFiles].sort((a,b) => (b.upload_time||0) - (a.upload_time||0));
                renderCurrentView(sortedSuccess);
            } else {
                // 所有文件视图
                renderAllView();
            }
        }
        
        function renderCurrentView(sortedSuccessFiles) {
            let totalSize = 0;
            let successCount = 0;
            let html = '';
            
            // 上传中的文件
            for (let [uploadId, upload] of activeUploads.entries()) {
                totalSize += upload.file.size;
                html += createFileItemHtml(uploadId, upload.file.name, upload.file.size, 'uploading', upload.progress);
            }
            
            // 已成功上传的当前会话文件（已排序）
            for (let file of sortedSuccessFiles) {
                totalSize += file.size || 0;
                successCount++;
                html += createFileItemHtml(file.filename, file.original_name || file.name, file.size, 'success', 0, file.upload_time);
            }
            
            // 失败的文件
            for (let [idx, f] of failedUploads.entries()) {
                totalSize += f.size;
                html += createFileItemHtml(`failed-${idx}`, f.name, f.size, 'failed');
            }
            
            if (html === '') {
                showEmptyState('当前没有上传文件');
                updateStats(0,0,0,0);
                return;
            }
            fileList.innerHTML = html;
            const totalCount = activeUploads.size + sortedSuccessFiles.length + failedUploads.length;
            updateStats(totalCount, totalSize, successCount, failedUploads.length);
            batchCopyCurrentBtn.disabled = (sortedSuccessFiles.length === 0);
            batchCopyAllBtn.disabled = (currentFiles.length === 0);
        }
        
        function renderAllView() {
            if (currentFiles.length === 0) {
                showEmptyState('暂无文件');
                updateStats(0,0,0,0);
                batchCopyAllBtn.disabled = true;
                return;
            }
            let totalSize = 0;
            let html = '';
            for (let file of currentFiles) {
                totalSize += file.size;
                html += createFileItemHtml(file.filename, file.name || file.filename, file.size, 'success', 0, file.upload_time);
            }
            fileList.innerHTML = html;
            updateStats(currentFiles.length, totalSize, currentFiles.length, 0);
            batchCopyCurrentBtn.disabled = true;
            batchCopyAllBtn.disabled = false;
        }
        
        function createFileItemHtml(fileId, fileName, fileSize, status, progress=0, uploadTime=null) {
            const sizeFmt = formatFileSize(fileSize || 0);
            const timeFmt = (status === 'success' && uploadTime) ? formatUploadTime(uploadTime) : '';
            let statusText = '', statusClass = '', actionButtons = '';
            if (status === 'uploading') {
                statusText = '上传中'; statusClass = 'status-uploading';
                actionButtons = `<button class="cancel-btn" onclick="cancelUpload('${fileId}')">取消</button>`;
            } else if (status === 'success') {
                statusText = '已上传'; statusClass = 'status-success';
                actionButtons = `<button class="copy-btn" onclick="copyLink('${fileId}', '${fileName.replace(/'/g, "\\'")}')">复制链接</button>`;
            } else if (status === 'failed') {
                statusText = '上传失败'; statusClass = 'status-failed';
                actionButtons = '';
            }
            const progressBar = (status === 'uploading') ? `<div class="progress-container" style="display:block"><div class="progress-bar" style="width:${progress}%"></div></div>` : '';
            const uuidHtml = (status === 'success') ? `<div class="file-uuid">文件ID: ${fileId.substring(0,8)}...</div>` : '';
            const timeHtml = (status === 'success' && timeFmt) ? `<div class="file-upload-time">上传时间: ${timeFmt}</div>` : '';
            return `
                <div class="file-item" data-id="${fileId}">
                    <div class="file-info"><div class="file-details">
                        <div class="file-name" title="${fileName.replace(/'/g, "\\'")}">${fileName}<span class="file-status ${statusClass}">${statusText}</span></div>
                        <div class="file-size">${sizeFmt}</div>
                        ${uuidHtml}
                        ${timeHtml}
                        ${progressBar}
                    </div></div>
                    <div class="file-actions">${actionButtons}</div>
                </div>
            `;
        }
        
        function showEmptyState(msg) {
            fileList.innerHTML = `<div class="empty-message"><div style="font-size:48px">📂</div><h3>${msg}</h3><p>${msg.includes('验证')?'请先输入密码验证身份':'上传文件后，它们会显示在这里'}</p></div>`;
        }
        
        function updateStats(total, size, success, failed) {
            totalFilesEl.textContent = total;
            totalSizeEl.textContent = formatFileSize(size);
            successCountEl.textContent = success;
            failedCountEl.textContent = failed;
        }
        
        // 上传逻辑
        async function uploadFile(file) {
            const allowedExts = ['.zip','.rar','.7z','.tar','.gz','.tar.gz'];
            const ext = getFileExtension(file.name);
            if (!allowedExts.includes(ext)) {
                alert(`不支持的文件格式: ${ext}`);
                failedUploads.push({ name: file.name, size: file.size, error: '格式不支持' });
                updateDisplay();
                return;
            }
            if (file.size > 1024*1024*1024) {
                alert(`文件太大 (最大1GB)`);
                failedUploads.push({ name: file.name, size: file.size, error: '超过大小限制' });
                updateDisplay();
                return;
            }
            const uploadId = 'upload_' + Date.now() + '_' + Math.random().toString(36).substr(2,9);
            activeUploads.set(uploadId, { file, progress: 0, xhr: null });
            updateDisplay();
            
            const formData = new FormData();
            formData.append('file', file);
            const xhr = new XMLHttpRequest();
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round(e.loaded/e.total*100);
                    const up = activeUploads.get(uploadId);
                    if (up) up.progress = percent;
                    updateDisplay();
                }
            });
            xhr.addEventListener('load', () => {
                handleUploadComplete(uploadId, xhr, file);
            });
            xhr.addEventListener('error', () => {
                handleUploadError(uploadId, file, '网络错误');
            });
            const up = activeUploads.get(uploadId);
            up.xhr = xhr;
            xhr.open('POST', '/upload');
            xhr.send(formData);
        }
        
        function handleUploadComplete(uploadId, xhr, file) {
            if (!activeUploads.has(uploadId)) return;
            try {
                const resp = JSON.parse(xhr.responseText);
                if (xhr.status===200 && resp.success) {
                    const fileData = {
                        filename: resp.filename,
                        name: file.name,
                        original_name: file.name,
                        size: file.size,
                        upload_time: resp.upload_time
                    };
                    currentSessionFiles.push(fileData);
                    currentSessionFiles.sort((a,b)=> (b.upload_time||0)-(a.upload_time||0));
                    activeUploads.delete(uploadId);
                    loadFiles();  // 同步服务器列表（静默失败也不影响显示）
                } else if (xhr.status===401) {
                    handleUploadError(uploadId, file, '会话过期');
                    updateAuthStatus();
                } else {
                    handleUploadError(uploadId, file, resp.message || '上传失败');
                }
            } catch(e) {
                handleUploadError(uploadId, file, '服务器响应错误');
            }
        }
        
        function handleUploadError(uploadId, file, errMsg) {
            if (!activeUploads.has(uploadId)) return;
            activeUploads.delete(uploadId);
            failedUploads.push({ name: file.name, size: file.size, error: errMsg });
            updateDisplay();
        }
        
        window.cancelUpload = function(uploadId) {
            const up = activeUploads.get(uploadId);
            if (up && up.xhr) {
                up.xhr.abort();
                handleUploadError(uploadId, up.file, '已取消');
            }
        };
        
        window.copyLink = async function(fileId, name) {
            const url = `${window.location.origin}/download/${fileId}`;
            try {
                await navigator.clipboard.writeText(url);
                alert(`✅ 链接已复制\n文件: ${name}\n${url}`);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = url;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert(`✅ 链接已复制（手动）\n${url}`);
            }
        };
        
        // 批量复制
        async function batchCopyCurrent() {
            if (currentSessionFiles.length === 0) { alert('当前没有可复制的文件'); return; }
            let links = '';
            currentSessionFiles.forEach((f,i) => {
                links += `${i+1}. ${f.original_name || f.name}\n${location.origin}/download/${f.filename}\n\n`;
            });
            await navigator.clipboard.writeText(links);
            alert(`已复制 ${currentSessionFiles.length} 个文件的链接`);
        }
        
        async function batchCopyAll() {
            if (currentFiles.length === 0) { alert('没有文件可复制'); return; }
            let links = '';
            currentFiles.forEach((f,i) => {
                links += `${i+1}. ${f.name}\n${location.origin}/download/${f.filename}\n\n`;
            });
            await navigator.clipboard.writeText(links);
            alert(`已复制 ${currentFiles.length} 个文件的链接`);
        }
        
        // 视图切换
        function switchView(view) {
            currentViewMode = view;
            if (view === 'current') {
                currentViewBtn.classList.add('active');
                allViewBtn.classList.remove('active');
            } else {
                currentViewBtn.classList.remove('active');
                allViewBtn.classList.add('active');
            }
            updateDisplay();
        }
        
        // 事件绑定
        passwordSubmitBtn.onclick = async () => {
            const pwd = passwordInput.value.trim();
            if (!pwd) { passwordError.textContent='请输入密码'; passwordError.classList.add('show'); return; }
            const res = await login(pwd);
            if (res.success) {
                await updateAuthStatus();
                passwordError.classList.remove('show');
                passwordInput.value = '';
            } else {
                passwordError.textContent = res.message || '密码错误';
                passwordError.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            }
        };
        passwordInput.addEventListener('keypress', e => { if(e.key==='Enter') passwordSubmitBtn.click(); });
        logoutBtn.onclick = async () => { await logout(); await updateAuthStatus(); };
        selectFileBtn.onclick = () => { if(isAuthenticated) fileInput.click(); else alert('请先验证密码'); };
        fileInput.onchange = (e) => {
            if(!isAuthenticated) return;
            Array.from(e.target.files).forEach(f=>uploadFile(f));
            fileInput.value = '';
        };
        uploadBox.ondragover = (e) => { e.preventDefault(); if(isAuthenticated) uploadBox.classList.add('dragover'); };
        uploadBox.ondragleave = () => uploadBox.classList.remove('dragover');
        uploadBox.ondrop = (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragover');
            if(!isAuthenticated) { alert('请先验证密码'); return; }
            Array.from(e.dataTransfer.files).forEach(f=>uploadFile(f));
        };
        batchCopyCurrentBtn.onclick = batchCopyCurrent;
        batchCopyAllBtn.onclick = batchCopyAll;
        currentViewBtn.onclick = () => switchView('current');
        allViewBtn.onclick = () => switchView('all');
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => updateAuthStatus());
        setInterval(() => { if(isAuthenticated && currentViewMode==='all') loadFiles(); }, 30000);
    </script>
</body>
</html>
