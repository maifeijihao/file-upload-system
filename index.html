mkdir -p templates
cat > templates/index.html << 'EOF'
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f5f5f5; padding: 20px; max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin: 20px 0 30px; color: #333; }
        .upload-area { border: 2px dashed #ccc; border-radius: 8px; padding: 40px 20px; text-align: center; margin-bottom: 30px; background-color: #fff; cursor: pointer; }
        .upload-area:hover { border-color: #4a90e2; background-color: #f9f9f9; }
        .upload-btn { background-color: #4a90e2; color: white; border: none; padding: 12px 24px; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .file-input { display: none; }
        .files-container { background-color: #fff; border-radius: 8px; padding: 20px; margin-bottom: 30px; }
        .stats-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 15px; background-color: #f8f9fa; border-radius: 6px; }
        .stats-left { display: flex; gap: 25px; }
        .stat-item { display: flex; align-items: center; gap: 5px; }
        .view-toggle { display: flex; gap: 10px; }
        .view-toggle-btn { background: none; border: none; padding: 8px 16px; cursor: pointer; background-color: #f1f1f1; border-radius: 4px; }
        .view-toggle-btn.active { background-color: #4a90e2; color: white; }
        .batch-copy-btn { background-color: #9b59b6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .batch-copy-current { background-color: #27ae60; }
        .file-list { max-height: 400px; overflow-y: auto; }
        .file-item { padding: 12px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .file-name { font-weight: bold; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-size { color: #666; font-size: 14px; }
        .file-uuid { color: #999; font-size: 11px; }
        .file-time { color: #888; font-size: 10px; }
        .file-status { font-size: 12px; padding: 2px 6px; border-radius: 3px; margin-left: 10px; }
        .status-success { background-color: #27ae60; color: white; }
        .copy-btn { background-color: #7f8c8d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .password-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .password-modal-content { background: white; border-radius: 8px; width: 90%; max-width: 400px; }
        .password-modal-header { background-color: #4a90e2; color: white; padding: 20px; text-align: center; }
        .password-modal-body { padding: 25px; }
        .password-input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 4px; }
        .password-modal-submit { background-color: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        .auth-status { position: fixed; top: 20px; right: 20px; background-color: #27ae60; color: white; padding: 8px 15px; border-radius: 4px; display: none; }
        .auth-logout { background-color: #e74c3c; border: none; padding: 4px 8px; margin-left: 10px; cursor: pointer; }
        .lock-icon { font-size: 24px; color: #ccc; }
    </style>
</head>
<body>
<div class="password-modal-overlay" id="passwordModal">
    <div class="password-modal-content">
        <div class="password-modal-header">密码验证</div>
        <div class="password-modal-body">
            <input type="password" class="password-input" id="passwordInput" placeholder="请输入访问密码">
            <button class="password-modal-submit" id="passwordSubmitBtn">验证</button>
            <div class="password-error" id="passwordError" style="color:red; display:none;">密码错误</div>
        </div>
    </div>
</div>
<div class="auth-status" id="authStatus">已通过验证 <button class="auth-logout" id="logoutBtn">退出</button></div>
<h1>压缩包上传与下载</h1>
<div class="upload-area" id="uploadBox">
    <p>拖放文件到此处或点击按钮选择</p>
    <button class="upload-btn" id="selectFileBtn">选择压缩包文件</button>
    <input type="file" class="file-input" id="fileInput" multiple accept=".zip,.rar,.7z,.tar,.gz,.tar.gz">
</div>
<div class="files-container">
    <div class="stats-row">
        <div class="stats-left">
            <div class="stat-item">文件数量: <span id="totalFiles">0</span></div>
            <div class="stat-item">总大小: <span id="totalSize">0</span></div>
            <div class="stat-item">成功: <span id="successCount">0</span></div>
            <div class="stat-item">失败: <span id="failedCount">0</span></div>
        </div>
        <div class="view-toggle">
            <button class="view-toggle-btn active" id="currentViewBtn">当前上传</button>
            <button class="view-toggle-btn" id="allViewBtn">查看所有</button>
        </div>
        <button class="batch-copy-btn batch-copy-current" id="batchCopyCurrentBtn">批量复制当前</button>
        <button class="batch-copy-btn" id="batchCopyAllBtn">批量复制所有</button>
    </div>
    <div class="file-list" id="fileList">暂无上传文件</div>
</div>
<script>
    const passwordModal = document.getElementById('passwordModal');
    const passwordInput = document.getElementById('passwordInput');
    const passwordSubmitBtn = document.getElementById('passwordSubmitBtn');
    const passwordError = document.getElementById('passwordError');
    const authStatus = document.getElementById('authStatus');
    const logoutBtn = document.getElementById('logoutBtn');
    const uploadBox = document.getElementById('uploadBox');
    const selectFileBtn = document.getElementById('selectFileBtn');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const currentViewBtn = document.getElementById('currentViewBtn');
    const allViewBtn = document.getElementById('allViewBtn');
    const batchCopyCurrentBtn = document.getElementById('batchCopyCurrentBtn');
    const batchCopyAllBtn = document.getElementById('batchCopyAllBtn');
    const totalFilesSpan = document.getElementById('totalFiles');
    const totalSizeSpan = document.getElementById('totalSize');
    const successCountSpan = document.getElementById('successCount');
    const failedCountSpan = document.getElementById('failedCount');

    let authenticated = false;
    let activeUploads = new Map();
    let failedUploads = [];
    let currentFiles = [];
    let currentSessionFiles = [];
    let currentView = 'current';

    function formatSize(bytes) {
        if (!bytes) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function formatTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        return d.toLocaleString();
    }

    async function checkAuth() {
        const res = await fetch('/check_auth');
        const data = await res.json();
        return data.authenticated;
    }

    async function login(pwd) {
        const res = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
        return await res.json();
    }

    async function logout() {
        await fetch('/logout', { method: 'POST' });
    }

    async function loadFiles() {
        const res = await fetch('/files');
        if (res.status === 401) return;
        const data = await res.json();
        if (data.success) {
            currentFiles = data.files.map(f => {
                f.server_filename = f.filename;   // 关键：后端返回的 filename 是实际存储名
                return f;
            });
            updateDisplay();
        }
    }

    function updateDisplay() {
        if (currentView === 'current') {
            const items = [];
            for (let [id, up] of activeUploads) {
                items.push({ type: 'uploading', id, name: up.file.name, size: up.file.size, progress: up.progress, time: up.startTime });
            }
            for (let f of currentSessionFiles) {
                const displayName = f.server_filename || f.original_name;
                items.push({ type: 'success', id: f.uuid, name: displayName, size: f.size, time: f._displayTime });
            }
            for (let i = 0; i < failedUploads.length; i++) {
                items.push({ type: 'failed', id: 'fail'+i, name: failedUploads[i].name, size: failedUploads[i].size, time: failedUploads[i].failTime });
            }
            items.sort((a,b) => (b.time||0) - (a.time||0));
            if (items.length === 0) { fileList.innerHTML = '<div>暂无上传文件</div>'; updateStats(0,0,0,0); return; }
            let totalSize = 0, success = 0, failed = 0;
            let html = '';
            for (let it of items) {
                totalSize += it.size || 0;
                if (it.type === 'success') success++;
                if (it.type === 'failed') failed++;
                html += `<div class="file-item">
                    <div><div class="file-name">${escapeHtml(it.name)} <span class="file-status status-success">${it.type==='uploading'?'上传中':(it.type==='success'?'已上传':'失败')}</span></div>
                    <div class="file-size">${formatSize(it.size)}</div>
                    <div class="file-time">${formatTime(it.time)}</div></div>
                    <div>${it.type==='success'?`<button class="copy-btn" onclick="copyLink('${it.id}','${escapeHtml(it.name)}')">复制链接</button>`:''}</div>
                </div>`;
            }
            fileList.innerHTML = html;
            updateStats(items.length, totalSize, success, failed);
        } else {
            const sorted = [...currentFiles].sort((a,b) => (b._displayTime||0) - (a._displayTime||0));
            if (sorted.length === 0) { fileList.innerHTML = '<div>暂无文件</div>'; updateStats(0,0,0,0); return; }
            let totalSize = 0;
            let html = '';
            for (let f of sorted) {
                totalSize += f.size || 0;
                const displayName = f.server_filename || f.original_name;
                html += `<div class="file-item">
                    <div><div class="file-name">${escapeHtml(displayName)} <span class="file-status status-success">已上传</span></div>
                    <div class="file-size">${formatSize(f.size)}</div>
                    <div class="file-time">上传时间: ${formatTime(f._displayTime)}</div></div>
                    <div><button class="copy-btn" onclick="copyLink('${f.uuid}','${escapeHtml(displayName)}')">复制链接</button></div>
                </div>`;
            }
            fileList.innerHTML = html;
            updateStats(sorted.length, totalSize, sorted.length, 0);
        }
    }

    function updateStats(total, size, success, failed) {
        totalFilesSpan.innerText = total;
        totalSizeSpan.innerText = formatSize(size);
        successCountSpan.innerText = success;
        failedCountSpan.innerText = failed;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    window.copyLink = async function(uuid, name) {
        const url = `${window.location.origin}/download/${uuid}`;
        await navigator.clipboard.writeText(url);
        alert(`复制成功: ${name}\n${url}`);
    };

    async function uploadFile(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (!['zip','rar','7z','tar','gz'].includes(ext) && !file.name.endsWith('.tar.gz')) {
            alert('不支持此文件类型');
            return;
        }
        const uploadId = Date.now() + '_' + Math.random();
        activeUploads.set(uploadId, { file, progress: 0, startTime: Date.now() });
        updateDisplay();
        const fd = new FormData();
        fd.append('file', file);
        const xhr = new XMLHttpRequest();
        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const percent = Math.round(e.loaded / e.total * 100);
                const up = activeUploads.get(uploadId);
                if (up) up.progress = percent;
                updateDisplay();
            }
        };
        xhr.onload = () => {
            if (xhr.status === 200) {
                const resp = JSON.parse(xhr.responseText);
                if (resp.success) {
                    currentSessionFiles.push({
                        uuid: resp.uuid_filename,
                        original_name: file.name,
                        server_filename: resp.filename,
                        size: file.size,
                        _displayTime: Date.now()
                    });
                } else {
                    failedUploads.push({ name: file.name, size: file.size, failTime: Date.now(), error: resp.message });
                }
            } else {
                failedUploads.push({ name: file.name, size: file.size, failTime: Date.now(), error: '上传失败' });
            }
            activeUploads.delete(uploadId);
            loadFiles(); // 重新拉取全部列表
            updateDisplay();
        };
        xhr.onerror = () => {
            failedUploads.push({ name: file.name, size: file.size, failTime: Date.now(), error: '网络错误' });
            activeUploads.delete(uploadId);
            updateDisplay();
        };
        xhr.open('POST', '/upload');
        xhr.send(fd);
    }

    async function batchCopyCurrent() {
        if (currentSessionFiles.length === 0) return alert('无当前文件');
        let links = '';
        currentSessionFiles.forEach((f,i) => {
            links += `${i+1}. ${f.server_filename || f.original_name}\n${location.origin}/download/${f.uuid}\n\n`;
        });
        await navigator.clipboard.writeText(links);
        alert(`已复制 ${currentSessionFiles.length} 个链接`);
    }

    async function batchCopyAll() {
        if (currentFiles.length === 0) return alert('无文件');
        let links = '';
        currentFiles.forEach((f,i) => {
            links += `${i+1}. ${f.server_filename || f.original_name}\n${location.origin}/download/${f.uuid}\n\n`;
        });
        await navigator.clipboard.writeText(links);
        alert(`已复制 ${currentFiles.length} 个链接`);
    }

    async function init() {
        authenticated = await checkAuth();
        if (authenticated) {
            passwordModal.style.display = 'none';
            authStatus.style.display = 'block';
            await loadFiles();
        } else {
            passwordModal.style.display = 'flex';
            authStatus.style.display = 'none';
        }
    }

    passwordSubmitBtn.onclick = async () => {
        const pwd = passwordInput.value;
        const res = await login(pwd);
        if (res.success) {
            authenticated = true;
            passwordModal.style.display = 'none';
            authStatus.style.display = 'block';
            await loadFiles();
        } else {
            passwordError.style.display = 'block';
        }
    };
    logoutBtn.onclick = async () => {
        await logout();
        authenticated = false;
        passwordModal.style.display = 'flex';
        authStatus.style.display = 'none';
        currentFiles = [];
        currentSessionFiles = [];
        activeUploads.clear();
        failedUploads = [];
        updateDisplay();
    };
    selectFileBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
        for (let f of e.target.files) uploadFile(f);
        fileInput.value = '';
    };
    uploadBox.ondragover = (e) => { e.preventDefault(); uploadBox.style.borderColor = '#4a90e2'; };
    uploadBox.ondragleave = () => { uploadBox.style.borderColor = '#ccc'; };
    uploadBox.ondrop = (e) => {
        e.preventDefault();
        uploadBox.style.borderColor = '#ccc';
        for (let f of e.dataTransfer.files) uploadFile(f);
    };
    currentViewBtn.onclick = () => { currentView = 'current'; currentViewBtn.classList.add('active'); allViewBtn.classList.remove('active'); updateDisplay(); };
    allViewBtn.onclick = () => { currentView = 'all'; currentViewBtn.classList.remove('active'); allViewBtn.classList.add('active'); updateDisplay(); };
    batchCopyCurrentBtn.onclick = batchCopyCurrent;
    batchCopyAllBtn.onclick = batchCopyAll;

    init();
</script>
</body>
</html>
EOF
