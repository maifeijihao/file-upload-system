<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>压缩包上传与下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }
        
        h1 {
            text-align: center;
            margin: 20px 0 30px;
            color: #333;
        }
        
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            background-color: #fff;
            cursor: pointer;
        }
        
        .upload-area:hover {
            border-color: #4a90e2;
            background-color: #f9f9f9;
        }
        
        .upload-area.dragover {
            border-color: #4a90e2;
            background-color: #f0f7ff;
        }
        
        .upload-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .upload-btn:hover {
            background-color: #3a7bc8;
        }
        
        .upload-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .file-input {
            display: none;
        }
        
        .files-container {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .stats-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 6px;
        }
        
        .stats-left {
            display: flex;
            gap: 25px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        
        .stat-value {
            font-weight: bold;
            font-size: 16px;
            min-width: 25px;
            text-align: center;
        }
        
        .file-count {
            color: #4a90e2;
        }
        
        .total-size {
            color: #9b59b6;
        }
        
        .success-count {
            color: #27ae60;
        }
        
        .failed-count {
            color: #e74c3c;
        }
        
        .batch-copy-btn {
            background-color: #9b59b6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .batch-copy-btn:hover {
            background-color: #8e44ad;
        }
        
        .batch-copy-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .file-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .file-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-item:last-child {
            border-bottom: none;
        }
        
        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .file-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4a90e2 0%, #9b59b6 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        
        .file-details {
            flex: 1;
        }
        
        .file-name {
            font-weight: bold;
            color: #333;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 5px;
        }
        
        .file-size {
            color: #666;
            font-size: 14px;
        }
        
        .file-uuid {
            color: #999;
            font-size: 11px;
            margin-top: 3px;
        }
        
        .copy-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .copy-btn:hover {
            background-color: #6c7b7d;
        }
        
        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 0;
        }
        
        /* 密码验证弹窗样式 */
        .password-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .password-modal-content {
            background-color: white;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        
        .password-modal-header {
            background-color: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .password-modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .password-modal-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .password-modal-body {
            padding: 25px;
        }
        
        .password-input-group {
            margin-bottom: 20px;
        }
        
        .password-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .password-input:focus {
            border-color: #4a90e2;
            outline: none;
        }
        
        .password-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        .password-modal-btn {
            padding: 10px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        
        .password-modal-submit {
            background-color: #27ae60;
            color: white;
        }
        
        .password-modal-submit:hover {
            background-color: #219653;
        }
        
        .password-error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .password-error.show {
            display: block;
        }
        
        /* 已登录状态样式 */
        .auth-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #27ae60;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            display: none;
        }
        
        .auth-status.show {
            display: block;
        }
        
        .auth-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .lock-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #ccc;
            z-index: 1;
        }
        
        .locked {
            position: relative;
        }
        
        .locked::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            z-index: 1;
        }
        
        /* 上传进度条 */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4a90e2 0%, #9b59b6 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .stats-row {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
            
            .stats-left {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
            
            .file-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
            
            .file-name {
                max-width: 200px;
            }
            
            .auth-status {
                position: static;
                margin-bottom: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- 密码验证弹窗 -->
    <div class="password-modal-overlay" id="passwordModal">
        <div class="password-modal-content">
            <div class="password-modal-header">
                <div class="password-modal-title">密码验证</div>
                <div class="password-modal-subtitle">请输入访问密码以使用上传功能</div>
            </div>
            <div class="password-modal-body">
                <div class="password-input-group">
                    <input type="password" class="password-input" id="passwordInput" placeholder="请输入访问密码" autocomplete="current-password">
                    <div class="password-error" id="passwordError">密码错误，请重试</div>
                </div>
                <div class="password-modal-footer">
                    <button class="password-modal-btn password-modal-submit" id="passwordSubmitBtn">验证</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 已登录状态提示 -->
    <div class="auth-status" id="authStatus">
        已通过验证
        <button class="auth-logout" id="logoutBtn">退出</button>
    </div>
    
    <h1>压缩包上传与下载</h1>
    
    <div class="upload-area" id="uploadBox">
        <p>拖放文件到此处或点击按钮选择</p>
        <button class="upload-btn" id="selectFileBtn">选择压缩包文件</button>
        <input type="file" class="file-input" id="fileInput" multiple accept=".zip,.rar,.7z,.tar,.gz,.tar.gz">
        <div class="lock-icon" id="lockIcon">🔒</div>
    </div>
    
    <div class="files-container" id="filesContainer">
        <div class="stats-row">
            <div class="stats-left">
                <div class="stat-item">
                    <span class="stat-label">文件数量:</span>
                    <span class="stat-value file-count" id="totalFiles">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">总大小:</span>
                    <span class="stat-value total-size" id="totalSize">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">成功:</span>
                    <span class="stat-value success-count" id="successCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">失败:</span>
                    <span class="stat-value failed-count" id="failedCount">0</span>
                </div>
            </div>
            <button class="batch-copy-btn" id="batchCopyBtn" disabled>批量复制所有链接</button>
        </div>
        
        <div class="file-list" id="fileList">
            <div class="empty-message" id="noFilesMessage">暂无上传文件</div>
        </div>
    </div>

    <script>
        // ==================== DOM 元素 ====================
        const passwordModal = document.getElementById('passwordModal');
        const passwordInput = document.getElementById('passwordInput');
        const passwordSubmitBtn = document.getElementById('passwordSubmitBtn');
        const passwordError = document.getElementById('passwordError');
        const authStatus = document.getElementById('authStatus');
        const logoutBtn = document.getElementById('logoutBtn');
        const uploadBox = document.getElementById('uploadBox');
        const selectFileBtn = document.getElementById('selectFileBtn');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const batchCopyBtn = document.getElementById('batchCopyBtn');
        const lockIcon = document.getElementById('lockIcon');
        
        // 统计元素
        const totalFilesEl = document.getElementById('totalFiles');
        const totalSizeEl = document.getElementById('totalSize');
        const successCountEl = document.getElementById('successCount');
        const failedCountEl = document.getElementById('failedCount');
        
        // 状态变量
        let isAuthenticated = false;
        let uploadQueue = [];
        let activeUploads = new Map();
        let failedUploads = [];
        let currentFiles = [];
        
        // ==================== 工具函数 ====================
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function getFileExtension(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (filename.toLowerCase().endsWith('.tar.gz')) return '.tar.gz';
            return '.' + ext;
        }
        
        // ==================== 认证相关 ====================
        async function checkAuth() {
            try {
                const response = await fetch('/check_auth');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                return data.authenticated || false;
            } catch (error) {
                console.error('检查认证失败:', error);
                return false;
            }
        }
        
        async function login(password) {
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                return await response.json();
            } catch (error) {
                console.error('登录失败:', error);
                return { success: false, message: '网络错误' };
            }
        }
        
        async function logout() {
            try {
                await fetch('/logout', { method: 'POST' });
                return true;
            } catch (error) {
                console.error('登出失败:', error);
                return false;
            }
        }
        
        async function updateAuthStatus() {
            isAuthenticated = await checkAuth();
            
            if (isAuthenticated) {
                passwordModal.style.display = 'none';
                authStatus.classList.add('show');
                uploadBox.classList.remove('locked');
                lockIcon.style.display = 'none';
                selectFileBtn.disabled = false;
                uploadBox.style.cursor = 'pointer';
                selectFileBtn.style.cursor = 'pointer';
                await loadFiles();
            } else {
                passwordModal.style.display = 'flex';
                authStatus.classList.remove('show');
                uploadBox.classList.add('locked');
                lockIcon.style.display = 'block';
                selectFileBtn.disabled = true;
                uploadBox.style.cursor = 'not-allowed';
                selectFileBtn.style.cursor = 'not-allowed';
                showEmptyState('请先通过密码验证');
                updateStats(0, 0, 0, 0);
            }
        }
        
        // ==================== 文件管理 ====================
        async function loadFiles() {
            try {
                const response = await fetch('/files');
                if (response.status === 401) {
                    await updateAuthStatus();
                    return;
                }
                
                if (!response.ok) throw new Error('获取文件列表失败');
                
                const data = await response.json();
                if (!data.success) throw new Error(data.message);
                
                currentFiles = data.files || [];
                displayFiles(currentFiles);
                
            } catch (error) {
                console.error('加载文件失败:', error);
                showEmptyState('加载文件列表失败');
            }
        }
        
        function displayFiles(files) {
            if (!files || files.length === 0) {
                showEmptyState('暂无文件');
                updateStats(0, 0, 0, failedUploads.length);
                return;
            }
            
            let totalSize = 0;
            let html = '';
            
            files.forEach(file => {
                totalSize += file.size || 0;
                const displayName = file.original_name || file.name || file.filename;
                const fileSize = formatFileSize(file.size || 0);
                const fileId = file.uuid || file.filename;
                const fileExt = getFileExtension(displayName).toLowerCase();
                
                // 根据文件类型设置图标
                let fileIcon = '📄';
                if (fileExt === '.zip') fileIcon = '🗜️';
                else if (fileExt === '.rar') fileIcon = '🗃️';
                else if (fileExt === '.7z') fileIcon = '🗄️';
                else if (fileExt === '.tar' || fileExt === '.tar.gz') fileIcon = '📦';
                else if (fileExt === '.gz') fileIcon = '💨';
                
                html += `
                    <div class="file-item" data-id="${fileId}">
                        <div class="file-info">
                            <div class="file-icon">${fileIcon}</div>
                            <div class="file-details">
                                <div class="file-name" title="${displayName}">${displayName}</div>
                                <div class="file-size">${fileSize}</div>
                                <div class="file-uuid">
                                    文件ID: ${fileId.substring(0, 8)}...
                                </div>
                            </div>
                        </div>
                        <div class="file-actions">
                            <button class="copy-btn" onclick="copyLink('${fileId}', '${displayName}')">复制链接</button>
                        </div>
                    </div>
                `;
            });
            
            fileList.innerHTML = html;
            updateStats(files.length, totalSize, files.length, failedUploads.length);
        }
        
        function showEmptyState(message = '暂无文件') {
            fileList.innerHTML = `
                <div class="empty-message">
                    <div style="font-size: 48px; margin-bottom: 20px;">📂</div>
                    <h3>${message}</h3>
                    <p>${message.includes('验证') ? '请先输入密码验证身份' : '上传文件后，它们会显示在这里'}</p>
                </div>
            `;
        }
        
        function updateStats(total, size, success, failed) {
            totalFilesEl.textContent = total;
            totalSizeEl.textContent = formatFileSize(size);
            successCountEl.textContent = success;
            failedCountEl.textContent = failed;
            batchCopyBtn.disabled = total === 0;
        }
        
        // ==================== 文件上传 ====================
        async function uploadFile(file) {
            // 验证文件类型
            const allowedExts = ['.zip', '.rar', '.7z', '.tar', '.gz', '.tar.gz'];
            const fileExt = getFileExtension(file.name);
            
            if (!allowedExts.includes(fileExt)) {
                alert(`不支持的文件格式: ${fileExt}\n请上传压缩文件 (ZIP, RAR, 7Z, TAR, GZ)`);
                failedUploads.push({ name: file.name, error: '不支持的文件格式' });
                updateStats(currentFiles.length, 
                           currentFiles.reduce((s, f) => s + (f.size || 0), 0),
                           currentFiles.length,
                           failedUploads.length);
                return;
            }
            
            // 验证文件大小 (1GB)
            if (file.size > 1024 * 1024 * 1024) {
                alert(`文件太大: ${formatFileSize(file.size)}\n最大支持 1GB`);
                failedUploads.push({ name: file.name, error: '文件超过大小限制' });
                updateStats(currentFiles.length,
                           currentFiles.reduce((s, f) => s + (f.size || 0), 0),
                           currentFiles.length,
                           failedUploads.length);
                return;
            }
            
            // 创建上传项目
            const uploadId = 'upload_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const uploadItem = createUploadItem(file, uploadId);
            
            // 准备表单数据
            const formData = new FormData();
            formData.append('file', file);
            
            // 创建 XMLHttpRequest
            const xhr = new XMLHttpRequest();
            
            // 进度事件
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    updateUploadProgress(uploadId, percent);
                }
            });
            
            // 完成事件
            xhr.addEventListener('load', () => {
                handleUploadComplete(uploadId, xhr, file);
            });
            
            // 错误事件
            xhr.addEventListener('error', () => {
                handleUploadError(uploadId, file, '网络错误');
            });
            
            // 存储上传
            activeUploads.set(uploadId, { xhr, file, item: uploadItem });
            
            // 发送请求
            xhr.open('POST', '/upload');
            xhr.send(formData);
        }
        
        function createUploadItem(file, uploadId) {
            // 移除空状态
            const noFilesMessage = document.getElementById('noFilesMessage');
            if (noFilesMessage && noFilesMessage.parentNode) {
                noFilesMessage.remove();
            }
            
            const item = document.createElement('div');
            item.className = 'file-item';
            item.id = uploadId;
            item.innerHTML = `
                <div class="file-info">
                    <div class="file-icon">⏳</div>
                    <div class="file-details">
                        <div class="file-name" title="${file.name}">${file.name}</div>
                        <div class="file-size">${formatFileSize(file.size)}</div>
                        <div class="progress-container">
                            <div class="progress-bar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="file-actions">
                    <button class="copy-btn" style="background-color: #e74c3c;" onclick="cancelUpload('${uploadId}')">
                        取消
                    </button>
                </div>
            `;
            
            // 显示进度条
            item.querySelector('.progress-container').style.display = 'block';
            
            // 添加到列表顶部
            fileList.prepend(item);
            return item;
        }
        
        function updateUploadProgress(uploadId, percent) {
            const item = document.getElementById(uploadId);
            if (item) {
                const progressBar = item.querySelector('.progress-bar');
                if (progressBar) {
                    progressBar.style.width = percent + '%';
                }
            }
        }
        
        function handleUploadComplete(uploadId, xhr, file) {
            const upload = activeUploads.get(uploadId);
            if (!upload) return;
            
            try {
                const response = JSON.parse(xhr.responseText);
                
                if (xhr.status === 200 && response.success) {
                    // 上传成功
                    upload.item.querySelector('.file-icon').textContent = '✅';
                    upload.item.querySelector('.file-icon').style.background = '#27ae60';
                    upload.item.querySelector('.progress-bar').style.background = '#27ae60';
                    
                    // 显示成功信息
                    const uuidFilename = response.uuid_filename || '未知UUID';
                    upload.item.querySelector('.file-name').innerHTML = 
                        `${file.name} <small style="color: #27ae60;">(上传成功)</small>`;
                    
                    setTimeout(() => {
                        if (upload.item.parentNode) {
                            upload.item.remove();
                        }
                        loadFiles(); // 重新加载文件列表
                    }, 1000);
                    
                } else if (xhr.status === 401) {
                    // 未授权
                    handleUploadError(uploadId, file, '会话过期，请重新登录');
                    updateAuthStatus();
                } else {
                    // 其他错误
                    const errorMsg = response.message || '上传失败';
                    handleUploadError(uploadId, file, errorMsg);
                }
            } catch (error) {
                handleUploadError(uploadId, file, '服务器响应错误');
            }
            
            activeUploads.delete(uploadId);
        }
        
        function handleUploadError(uploadId, file, error) {
            const upload = activeUploads.get(uploadId);
            if (!upload) return;
            
            upload.item.querySelector('.file-icon').textContent = '❌';
            upload.item.querySelector('.file-icon').style.background = '#e74c3c';
            upload.item.querySelector('.file-name').innerHTML = `${file.name} <small style="color: #e74c3c;">(${error})</small>`;
            upload.item.querySelector('.progress-bar').style.background = '#e74c3c';
            upload.item.querySelector('.copy-btn').style.display = 'none';
            
            failedUploads.push({ name: file.name, error });
            
            setTimeout(() => {
                if (upload.item.parentNode) {
                    upload.item.remove();
                }
                updateStats(currentFiles.length,
                           currentFiles.reduce((s, f) => s + (f.size || 0), 0),
                           currentFiles.length,
                           failedUploads.length);
            }, 3000);
            
            activeUploads.delete(uploadId);
        }
        
        // ==================== 全局函数 ====================
        window.cancelUpload = function(uploadId) {
            const upload = activeUploads.get(uploadId);
            if (upload && upload.xhr) {
                upload.xhr.abort();
                upload.item.querySelector('.file-icon').textContent = '⏹️';
                upload.item.querySelector('.file-icon').style.background = '#7f8c8d';
                upload.item.querySelector('.file-name').innerHTML = `${upload.file.name} <small style="color: #999;">(已取消)</small>`;
                
                setTimeout(() => {
                    if (upload.item.parentNode) {
                        upload.item.remove();
                    }
                }, 1000);
                
                activeUploads.delete(uploadId);
            }
        };
        
        window.copyLink = async function(fileId, displayName) {
            const fileUrl = `${window.location.origin}/download/${fileId}`;
            
            try {
                await navigator.clipboard.writeText(fileUrl);
                alert(`✅ 链接已复制到剪贴板\n\n文件名: ${displayName}\n链接: ${fileUrl}`);
            } catch (err) {
                // 备用方法
                const textarea = document.createElement('textarea');
                textarea.value = fileUrl;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    alert(`✅ 链接已复制到剪贴板\n\n文件名: ${displayName}\n链接: ${fileUrl}`);
                } catch (err2) {
                    alert('❌ 复制失败，请手动复制链接:\n' + fileUrl);
                }
                document.body.removeChild(textarea);
            }
        };
        
        // ==================== 事件监听 ====================
        // 密码验证
        passwordSubmitBtn.addEventListener('click', async () => {
            const password = passwordInput.value.trim();
            if (!password) {
                passwordError.textContent = '请输入密码';
                passwordError.classList.add('show');
                return;
            }
            
            const result = await login(password);
            
            if (result.success) {
                await updateAuthStatus();
                passwordError.classList.remove('show');
                passwordInput.value = '';
            } else {
                passwordError.textContent = result.message || '密码错误';
                passwordError.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            }
        });
        
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                passwordSubmitBtn.click();
            }
        });
        
        // 退出登录
        logoutBtn.addEventListener('click', async () => {
            await logout();
            await updateAuthStatus();
        });
        
        // 选择文件
        selectFileBtn.addEventListener('click', () => {
            if (!isAuthenticated) {
                alert('请先通过密码验证');
                return;
            }
            fileInput.click();
        });
        
        fileInput.addEventListener('change', (e) => {
            if (!isAuthenticated) {
                alert('请先通过密码验证');
                return;
            }
            
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            files.forEach(file => {
                uploadFile(file);
            });
            
            fileInput.value = ''; // 清除选择，允许选择相同文件
        });
        
        // 拖放上传
        uploadBox.addEventListener('dragover', (e) => {
            if (!isAuthenticated) {
                e.preventDefault();
                return;
            }
            e.preventDefault();
            uploadBox.classList.add('dragover');
        });
        
        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragover');
        });
        
        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragover');
            
            if (!isAuthenticated) {
                alert('请先通过密码验证');
                return;
            }
            
            const files = Array.from(e.dataTransfer.files);
            if (files.length === 0) return;
            
            files.forEach(file => {
                uploadFile(file);
            });
        });
        
        // 批量复制
        batchCopyBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/files');
                if (!response.ok) throw new Error('获取文件列表失败');
                
                const data = await response.json();
                if (!data.success) throw new Error(data.message);
                
                const files = data.files || [];
                if (files.length === 0) {
                    alert('没有文件可以复制');
                    return;
                }
                
                const serverUrl = window.location.origin;
                let allLinks = '';
                
                files.forEach((file, index) => {
                    const displayName = file.original_name || file.name || file.filename;
                    const fileId = file.uuid || file.filename;
                    const fileUrl = `${serverUrl}/download/${fileId}`;
                    allLinks += `${index + 1}. ${displayName}\n${fileUrl}\n\n`;
                });
                
                try {
                    await navigator.clipboard.writeText(allLinks);
                    alert(`✅ 已复制 ${files.length} 个文件的链接到剪贴板！`);
                } catch (err) {
                    // 备用方法
                    const textarea = document.createElement('textarea');
                    textarea.value = allLinks;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert(`✅ 已复制 ${files.length} 个文件的链接到剪贴板！`);
                }
                
            } catch (error) {
                console.error('批量复制失败:', error);
                alert('批量复制失败: ' + error.message);
            }
        });
        
        // ==================== 初始化 ====================
        async function init() {
            await updateAuthStatus();
            
            // 每30秒刷新文件列表
            setInterval(async () => {
                if (isAuthenticated) {
                    await loadFiles();
                }
            }, 30000);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
